<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leria — дневник головной боли</title>
  <meta name="description" content="Leria — дневник головной боли. Все записи хранятся только на вашем телефоне.">
  <meta name="theme-color" content="#171c1a">
  <script>
    // Apply the chosen theme and brightness before the first paint, so the screen never flashes.
    try {
      var theme = localStorage.getItem('theme') || 'moss';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name=theme-color]').content = { moss: '#171c1a', dusk: '#1d1a17', paper: '#ebe6dc' }[theme] || '#171c1a';
    } catch (e) { /* storage blocked: default theme */ }
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Leria">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" aria-label="Разделы">
    <a href="#diary" data-tab="diary"><span class="ico">✎</span>Дневник</a>
    <a href="#calendar" data-tab="calendar"><span class="ico">▦</span>Календарь</a>
    <button id="fab" class="tabpain" aria-label="Записать боль"><span class="ico"><i aria-hidden="true"><svg viewBox="0 0 24 12" width="22" height="11"><path d="M3 6C5.5 0 9.5 0 12 6S18.5 12 21 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></i></span>Болит</button>
    <a href="#data" data-tab="data"><span class="ico">◔</span>Мои данные</a>
    <a href="#settings" data-tab="settings"><span class="ico">⚙</span>Настройки</a>
  </nav>
  <div id="sheet"></div>
  <div id="toast" role="status"></div>
  <div id="dim" aria-hidden="true"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
